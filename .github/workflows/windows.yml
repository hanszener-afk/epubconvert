# Builds the portable Windows program and runs the test suite on Windows.
# The zip is attached to each run as an artifact (Actions tab, the run, then
# "Artifacts" at the bottom).
name: Windows build

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/requirements-build.txt
          pip install --no-deps -e .

      - name: Test
        run: python -m pytest -q

      - name: Build
        env:
          JAVA_VENDOR: Eclipse Temurin (https://adoptium.net)
        run: python scripts/build_exe.py

      - uses: actions/upload-artifact@v5
        with:
          name: novel2epub-windows
          path: dist/novel2epub-*-windows.zip
          if-no-files-found: error
