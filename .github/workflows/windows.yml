# Builds the portable Windows program and runs the test suite on Windows.
# The zip is attached to each run as an artifact (Actions tab, the run, then
# "Artifacts" at the bottom).
#
# To publish a release: Actions, "Windows build", "Run workflow" on main, and
# enter the version (it must match pyproject.toml, for example 0.5.0). The run
# builds and tests as usual, then creates the tag v0.5.0 and a GitHub Release
# with the zip: a download link that does not expire and needs no account.
# Pushing a v* tag does the same.
name: Windows build

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, as in pyproject.toml (for example 0.5.0). Leave blank to only build."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/requirements-build.txt
          pip install --no-deps -e .

      - name: Test
        run: python -m pytest -q

      - name: Build
        env:
          JAVA_VENDOR: Eclipse Temurin (https://adoptium.net)
        run: python scripts/build_exe.py

      - uses: actions/upload-artifact@v6
        with:
          name: novel2epub-windows
          path: dist/novel2epub-*-windows.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: novel2epub-windows

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          zip="novel2epub-${TAG#v}-windows.zip"
          if [ ! -f "$zip" ]; then
            echo "No $zip: the version asked for does not match the version built." >&2
            ls >&2
            exit 1
          fi
          gh release create "$TAG" "$zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "novel2epub $TAG" \
            --notes "Windows: download the zip, unzip it anywhere, and see README.txt inside. Nothing to install; Java is included."
